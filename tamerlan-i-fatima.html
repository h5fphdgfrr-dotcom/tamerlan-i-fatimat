<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тамерлан и Фатима – Свадебный сайт</title>
<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: #fef8f9;
  text-align: center;
  color: #333;
  overflow-x: hidden;
}
header {
  padding: 50px 20px;
  background: #ffe3eb;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}
h1 { margin: 0; font-size: 36px; }
p { font-size: 18px; margin-top: 10px; }
section { padding: 40px 10px; }

/* Видео Reels */
.reel-style {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 9/16;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  margin: 30px auto;
  display: block;
  opacity: 0;
  transform: translateY(50px) scale(0.9) rotateX(10deg);
  transition: all 1s ease;
}
.reel-style.show {
  opacity: 1;
  transform: translateY(0) scale(1) rotateX(0deg);
}

/* Фото 1 с белым квадратом для дней */
.photo1-container {
  position: relative;
  display: inline-block;
  max-width: 360px;
  width: 100%;
  margin: 40px auto;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  opacity: 0;
  transform: translateY(50px) scale(0.9) rotateX(10deg);
  transition: all 1s ease;
}
.photo1-container.show {
  opacity: 1;
  transform: translateY(0) scale(1) rotateX(0deg);
}
.photo1-container img {
  width: 100%;
  border-radius: 16px;
  display: block;
}
.photo1-counter {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  color: #000000; /* черный цвет */
  font-weight: bold;
  font-size: 22px;
  padding: 15px 25px;
  border-radius: 16px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Фото 2 с опросом */
.photo2-container {
  position: relative;
  display: inline-block;
  max-width: 360px;
  width: 100%;
  margin: 40px auto;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  opacity: 0;
  transform: translateY(50px) scale(0.9) rotateX(10deg);
  transition: all 1s ease;
}
.photo2-container.show {
  opacity: 1;
  transform: translateY(0) scale(1) rotateX(0deg);
}
.photo2-container img {
  width: 100%;
  border-radius: 16px;
  display: block;
}
.photo2-text {
  position: absolute;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: bold;
  color: #000000; /* черный текст */
  background: rgba(255,255,255,0.8);
  padding: 8px 12px;
  border-radius: 10px;
}
.photo2-buttons {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.photo2-buttons button {
  padding: 12px 25px;
  margin: 5px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  background: #ff6b96;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}
.photo2-buttons button:hover { background: #ff4d7a; transform: scale(1.05); }

/* Кнопка карты */
.map-button {
  display: inline-block;
  margin: 20px auto;
  padding: 12px 30px;
  font-size: 18px;
  color: #ffffff; /* белый текст */
  background-color: #000000; /* черная кнопка */
  border: none;
  border-radius: 12px;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}
.map-button:hover {
  background-color: #333333;
  transform: scale(1.05);
}

@media (min-width: 768px) {
  .reel-style, .photo1-container, .photo2-container { max-width: 480px; }
  .photo1-counter { font-size: 26px; padding: 20px 35px; }
  .photo2-buttons button { font-size: 18px; padding: 12px 25px; }
  .photo2-text { font-size: 20px; padding: 10px 15px; }
}
</style>
</head>
<body>

<header>
  <h1>Тамерлан и Фатима</h1>
  <p>До нашей свадьбы осталось совсем немного!</p>
</header>

<!-- Видео 1 -->
<section>
  <video class="reel-style" controls autoplay muted loop playsinline>
    <source src="./videos/video1.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
  </video>
</section>

<!-- Видео 3 -->
<section>
  <video class="reel-style" controls autoplay muted loop playsinline>
    <source src="./videos/video3.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
  </video>
</section>

<!-- Видео 2 -->
<section>
  <video class="reel-style" controls autoplay muted loop playsinline>
    <source src="./videos/video2.mp4" type="video/mp4">
    Ваш браузер не поддерживает видео.
  </video>
</section>

<!-- Кнопка "Посмотреть на карте" -->
<section>
  <a href="https://yandex.ru/maps/org/bridge/1321493943?si=254zacd49jdudm1zyx3wkry6y0" target="_blank" class="map-button">
    Посмотреть на карте
  </a>
</section>

<!-- Фото 1 с счетчиком -->
<section>
  <div class="photo1-container">
    <img src="./photos/photo1.jpg" alt="Фото 1">
    <div class="photo1-counter" id="daysCounter">До начала бракосочетания осталось: ... дней</div>
  </div>
</section>

<!-- Фото 2 с опросом через WhatsApp -->
<section>
  <div class="photo2-container">
    <img src="./photos/photo2.jpg" alt="Фото 2">
    <div class="photo2-text">Придете ли вы на нашу свадьбу?</div>
    <div class="photo2-buttons">
      <button onclick="voteWhatsApp('Да')">Да</button>
      <button onclick="voteWhatsApp('Нет')">Нет</button>
    </div>
  </div>
</section>

<script>
// ====== Счётчик дней ======
const weddingDate = new Date("2026-06-15");
const today = new Date("2026-01-07");
const daysCounterEl = document.getElementById("daysCounter");
function updateDays() {
  const diffTime = weddingDate - today;
  const diffDays = Math.ceil(diffTime / (1000*60*60*24));
  daysCounterEl.innerHTML = `До начала бракосочетания осталось ${diffDays} дней`;
}
updateDays();

// ====== Опрос через WhatsApp ======
const phoneNumber = '+79627710923';
function voteWhatsApp(answer) {
  const url = `https://wa.me/${phoneNumber.replace(/\D/g,'')}?text=${encodeURIComponent(answer)}`;
  window.open(url, '_blank');
}

// ====== Анимация появления при скролле ======
function revealOnScroll() {
  const elements = document.querySelectorAll('.reel-style, .photo1-container, .photo2-container');
  const windowHeight = window.innerHeight;
  elements.forEach(el => {
    const elementTop = el.getBoundingClientRect().top;
    if(elementTop < windowHeight - 50) el.classList.add('show');
  });
}
window.addEventListener('scroll', revealOnScroll);
window.addEventListener('load', revealOnScroll);
</script>

</body>
</html>
